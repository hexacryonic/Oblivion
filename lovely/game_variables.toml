[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# lovely/game_variables.toml
# Addition of new game variables

# ----

# function G.FUNCS.evaluate_play
# Update last-played-hand tracker
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "SMODS.calculate_context({full_hand = G.play.cards, scoring_hand = scoring_hand, scoring_name = text, poker_hands = poker_hands, after = true})"
position = "after"
payload = "Ovn_f.update_hands_last_played(text)"
match_indent = true

# ----

# function G.FUNCS.evaluate_play
# Note whether specific hands are played in a round
[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "local text,disp_text,poker_hands,scoring_hand,non_loc_disp_text = G.FUNCS.get_poker_hand_info(G.play.cards)"
position = "after"
payload = '''
if disp_text == "Royal Flush" then
  G.GAME.current_round.played_royal_flush = true
end
if next(poker_hands["ovn_Straight Spectrum"]) then
  G.GAME.current_round.played_straight_spec = true
end
'''
match_indent = true

# ----

# function CardArea:draw
# -inf text on Joker CardArea
[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = '''
local card_count = self ~= G.shop_vouchers and {n=G.UIT.R, config={align = self == G.jokers and 'cl' or self == G.hand and 'cm' or 'cr', padding = 0.03, no_fill = true}, nodes={
    {n=G.UIT.B, config={w = 0.1,h=0.1}},
    {n=G.UIT.T, config={ref_table = self.config, ref_value = 'card_count', scale = 0.3, colour = G.C.WHITE}},
    {n=G.UIT.T, config={text = '/', scale = 0.3, colour = G.C.WHITE}},
    {n=G.UIT.T, config={ref_table = self.config, ref_value = 'true_card_limit', scale = 0.3, colour = G.C.WHITE}},
    {n=G.UIT.B, config={w = 0.1,h=0.1}}
}} or nil
'''
position = "after"
payload = '''
if self == G.jokers and Ovn_f.on_deck("c_painted") and card_count then
  card_count.nodes[4].config = {text='-inf', scale = 0.3, colour = G.C.WHITE}
end
'''
match_indent = true