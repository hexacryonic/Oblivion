[manifest]
version = "1.0.0"
dump_lua = true
priority = 0

# lovely/miscellaneous.toml

# ----

# function Card:remove_from_deck
# All-encompassing "card_removed" context
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = '''
if self.ability.name == 'Stuntman' then
    G.hand:change_size(self.ability.extra.h_size)
end
'''
position = "after"
payload = '''
SMODS.calculate_context{ovn_card_removed = true, card = self, from_debuff = from_debuff}
'''
match_indent = true

# ----

# function CardArea:draw
# -inf text on Joker CardArea
[[patches]]
[patches.pattern]
target = "cardarea.lua"
pattern = '''
local card_count = self ~= G.shop_vouchers and {n=G.UIT.R, config={align = self == G.jokers and 'cl' or self == G.hand and 'cm' or 'cr', padding = 0.03, no_fill = true}, nodes={
    {n=G.UIT.B, config={w = 0.1,h=0.1}},
    {n=G.UIT.T, config={ref_table = self.config, ref_value = 'card_count', scale = 0.3, colour = G.C.WHITE}},
    {n=G.UIT.T, config={text = '/', scale = 0.3, colour = G.C.WHITE}},
    {n=G.UIT.T, config={ref_table = self.config, ref_value = 'true_card_limit', scale = 0.3, colour = G.C.WHITE}},
    {n=G.UIT.B, config={w = 0.1,h=0.1}}
}} or nil
'''
position = "after"
payload = '''
if self == G.jokers and Ovn_f.on_deck("c_painted") and card_count then
  card_count.nodes[4].config = {text='-inf', scale = 0.3, colour = G.C.WHITE}
end
'''
match_indent = true

# ----

# In Steamodded:
# function G.FUNCS.hand_type_UI_set
# Increase sigfigs for instability
[[patches]]
[patches.pattern]
target = '''=[SMODS _ "src/ui.lua"]'''
pattern = '''
local new_mult_text = number_format(G.GAME.current_round.current_hand[e.config.type] or SMODS.Scoring_Parameters[e.config.type].default_value)
'''
position = "after"
payload = '''
local num = G.GAME.current_round.current_hand[e.config.type] or SMODS.Scoring_Parameters[e.config.type].default_value

if (e.config.type == "ovn_instability") and (num <= 10) and (tonumber(("%.2f"):format(num)) ~= tonumber(("%.3f"):format(num))) then
  new_mult_text = ("%.3f"):format(num)
end
'''
match_indent = true

# ----

# function create_UIBox_blind_choice
# Makes blind requirement glitchy on Corrupt Erratic Deck
[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = '''
{n=G.UIT.T, config={text = number_format(blind_amt), scale = score_number_scale(0.9, blind_amt), colour = disabled and G.C.UI.TEXT_INACTIVE or G.C.RED, shadow =  not disabled}}
'''
position = "before"
payload = '''
G.GAME.c_erratic and
SMODS.localize_box(loc_parse_string("{C:red,E:ovn_glitched}????"), {scale=score_number_scale(0.9,6666)/0.32})[1]
or
'''
match_indent = true

# ----

# function Card:use_consumeable
# Specified self.ability.consumeable.conv_sound is used
[[patches]]
[patches.pattern]
target = 'card.lua'
pattern = '''
G.E_MANAGER:add_event(Event({trigger = 'after',delay = 0.15,func = function() G.hand.highlighted[i]:flip();play_sound('tarot2', percent, 0.6);G.hand.highlighted[i]:juice_up(0.3, 0.3);return true end }))
'''
position = "at"
payload = '''
if self.ability.consumeable.conv_sound then
  local sound_key = self.ability.consumeable.conv_sound.key or 'tarot2'
  local sound_per = self.ability.consumeable.conv_sound.per or percent
  local sound_vol = self.ability.consumeable.conv_sound.vol or 0.6
  G.E_MANAGER:add_event(Event({trigger = 'after',delay = 0.15,func = function() G.hand.highlighted[i]:flip();play_sound(sound_key, sound_per, sound_vol);G.hand.highlighted[i]:juice_up(0.3, 0.3);return true end }))
else
  G.E_MANAGER:add_event(Event({trigger = 'after',delay = 0.15,func = function() G.hand.highlighted[i]:flip();play_sound('tarot2', percent, 0.6);G.hand.highlighted[i]:juice_up(0.3, 0.3);return true end }))
end
'''
match_indent = true

# ----

# function G.UIDEF.challenge_list_page(_page)
# Corrupt challenges automatically have corrupt button colors
[[patches]]
[patches.pattern]
target = 'functions/UI_definitions.lua'
pattern = '''
if k > G.CHALLENGE_PAGE_SIZE*(_page or 0) and k <= G.CHALLENGE_PAGE_SIZE*((_page or 0) + 1) then
'''
position = "before"
payload = '''
v.button_colour = v.button_colour or (v.ovn_corrupt_challenge and G.C.RARITY['ovn_corrupted']) or nil
'''
match_indent = true

# ----

# function G.FUNCS.draw_from_deck_to_hand
# Tungsten Card fix
# (Actually a card_limit fix with SMODS in general)

[[patches]]
[patches.pattern]
target = 'functions/state_events.lua'
match_indent = true
position = 'at'
pattern = '''
if cards_to_draw[i] and cards_to_draw[i].ability and cards_to_draw[i].ability.extra_slots_used then
    SMODS.cards_to_draw = SMODS.cards_to_draw + cards_to_draw[i].ability.extra_slots_used
    G.E_MANAGER:add_event(Event({
        trigger = 'immediate',
        func = function()                
            SMODS.cards_to_draw = SMODS.cards_to_draw - cards_to_draw[i].ability.extra_slots_used
            return true
        end
    }))
end
draw_card(G.deck,G.hand, i*100/hand_space,'up', true, cards_to_draw[i])
'''
payload = '''
if cards_to_draw[i] and cards_to_draw[i].ability and (cards_to_draw[i].ability.extra_slots_used or cards_to_draw[i].ability.card_limit) then
    SMODS.cards_to_draw = SMODS.cards_to_draw + (cards_to_draw[i].ability.extra_slots_used or 0) - (cards_to_draw[i].ability.card_limit or 0)
    G.E_MANAGER:add_event(Event({
        trigger = 'immediate',
        func = function()                
            SMODS.cards_to_draw = SMODS.cards_to_draw - (cards_to_draw[i].ability.extra_slots_used or 0) + (cards_to_draw[i].ability.card_limit or 0)
            return true
        end
    }))
end
draw_card(G.deck,G.hand, i*100/hand_space,'up', true, cards_to_draw[i])
'''